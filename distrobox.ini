# ~/prog/distrobox/distrobox.ini
#
# Rebuild one:   distrobox rm --force NAME
#                distrobox assemble create --file ~/prog/distrobox/distrobox.ini
# Rebuild all:   distrobox assemble create --file ~/prog/distrobox/distrobox.ini
#
# Quarterly drift check: destroy a box, rebuild from this file, confirm your
# work still works. If it doesn't, this file had drifted and you found out cheap.


# ---------------------------------------------------------------------------
# claude-desktop — VERIFIED, this is exactly what was built and works
# ---------------------------------------------------------------------------
# Do NOT add nvidia=true. On this host it hangs for 20+ minutes at
# "Setting up host's nvidia integration" (ublue-os/bazzite#5172). The app is
# Electron; the host compositor draws the window using the host driver.
#
# The two additional_flags ARE load-bearing, despite an earlier conclusion that
# they weren't: Cowork's device_bash runs in a real local KVM guest on this
# machine, using the host's vhost_vsock.

[claude-desktop]
image=ubuntu:24.04
additional_flags="--group-add keep-groups --volume /lib/modules:/lib/modules:ro"
additional_packages="curl gnupg alsa-utils alsa-tools lib32z1 libnss3"
init_hooks=/var/home/zefs/prog/distrobox/claude-desktop-init.sh
exported_apps=claude-desktop
start_now=true


# ---------------------------------------------------------------------------
# dev — VERIFIED against the box's own dnf history, 2026-09-20
# ---------------------------------------------------------------------------
# Reconstructed from inside the running box. `dnf history` shows two installs
# beyond the image build and distrobox's default tool set: the Bevy set, run
# by hand on 2026-09-17, and git, added 2026-09-20 because the box had none
# and Claude Code inside it couldn't see the repo. All names resolve. The box
# was made with a bare `distrobox create --name dev --image fedora:44` — no
# extra flags, so none are declared here.
#
# The earlier "known wrong package names" note was bwapi's problem (the i686
# and wine wrangling in shell history), not this box's.
#
# mesa-vulkan-drivers is already in distrobox's default Fedora package set.
# It stays listed because Bevy needs it and that default is not ours to rely on.
#
# rustup / rust-analyzer / node / python tooling are deliberately absent:
# they live in $HOME (~/.cargo, ~/.rustup), which is shared, so they survive
# a rebuild without being declared here. python3 is present in the box only
# as a weak dependency of distrobox's tool set, not because anything asked.

[dev]
image=fedora:44
additional_packages="git gcc-c++ libX11-devel alsa-lib-devel systemd-devel wayland-devel libxkbcommon-devel mesa-vulkan-drivers mold clang mise valgrind gtk4-devel"
start_now=false
# init_hooks=/var/home/zefs/prog/distrobox/dev-init.sh
# Consider a per-container CARGO_TARGET_DIR here — target/ dirs built against
# different glibc will thrash between boxes. Untested, see bazzite-03-reference.


# ---------------------------------------------------------------------------
# bwapi — VERIFIED against the box's own dnf history, 2026-09-20
# ---------------------------------------------------------------------------
# Reconstructed from inside the running box (`dnf history`, `.bash_history`,
# /var/log/dnf5.log). The box was made with a bare
# `distrobox create --name bwapi --image fedora:44`, so no flags are declared.
# Fedora, not Arch: the Arch argument was about 32-bit multilib, and it turns
# out we don't want multilib at all (see below).
#
# Three toolchains, all verified to produce byte-identical layouts for the
# BWAPI client-protocol structs:
#   64-bit Linux    gcc-c++ + cmake/ninja/make, clang-tools-extra, gdb
#   64-bit Windows  mingw64-gcc-c++  (x86_64-w64-mingw32-g++, cross)
#   32-bit Windows  mingw32-gcc-c++  (i686-w64-mingw32-g++, cross)
#
# 32-bit LINUX IS FORBIDDEN. Its struct layouts do not match the other three.
# Never add glibc-devel.i686, libstdc++-devel.i686 or any other .i686 -devel
# package here. They were installed once on 2026-09-17 by mistake (reaching for
# "32-bit" when we meant win32 cross) and removed twenty minutes later. Two
# runtime leftovers, libstdc++.i686 and cmake-filesystem.i686, survived that
# removal and were cleaned up on 2026-09-20. glibc.i686, glibc-gconv-extra.i686
# and libgcc.i686 are distrobox's doing, not ours: they arrive with its default
# Fedora tool set before anything here runs. Runtime libs only, no compiler,
# harmless. If `rpm -qa | grep i686` ever shows more than those three, find
# out why.
#
# mingw32-cmake / mingw64-cmake are not packages. They're wrapper scripts in
# mingw32-filesystem / mingw64-filesystem, which the gcc packages already pull
# in; `dnf install mingw32-cmake` was a no-op. Don't list them.
#
# SDL2-devel resolves to sdl2-compat-devel on Fedora 44 (a virtual provide);
# the generic name is kept so it survives Fedora renaming it again. SDL2 is
# for OpenBW, the Linux-native BWAPI backend, not for BWAPI itself.
#
# wine here is the WoW64 build: wine.x86_64 has no x86-32 requirements, so a
# rebuild pulls no i686 wine. It does pull ~650 packages of weak deps (KDE
# dialogs, samba, pipewire, qt6). Ugly but inert; additional_packages can't
# pass --setopt=install_weak_deps=False, so live with it.
#
# git: added 2026-09-20 for the same reason as in dev (Claude Code inside the
# box needs it). Installed by hand the same day; the box matches this file.

[bwapi]
image=fedora:44
additional_packages="git gcc-c++ cmake ninja-build make clang-tools-extra gdb mingw32-gcc-c++ mingw32-winpthreads-static mingw64-gcc-c++ mingw64-winpthreads-static SDL2-devel SDL2_mixer-devel wine winetricks"
start_now=false
