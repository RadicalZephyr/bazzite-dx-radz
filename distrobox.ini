# ~/prog/distrobox/distrobox.ini
#
# Rebuild one:   distrobox rm --force NAME
#                distrobox assemble create --file ~/prog/distrobox/distrobox.ini
# Rebuild all:   distrobox assemble create --file ~/prog/distrobox/distrobox.ini
#
# Quarterly drift check: destroy a box, rebuild from this file, confirm your
# work still works. If it doesn't, this file had drifted and you found out cheap.


# ---------------------------------------------------------------------------
# claude-desktop — VERIFIED, this is exactly what was built and works
# ---------------------------------------------------------------------------
# Do NOT add nvidia=true. On this host it hangs for 20+ minutes at
# "Setting up host's nvidia integration" (ublue-os/bazzite#5172). The app is
# Electron; the host compositor draws the window using the host driver.
#
# The two additional_flags ARE load-bearing, despite an earlier conclusion that
# they weren't: Cowork's device_bash runs in a real local KVM guest on this
# machine, using the host's vhost_vsock.

[claude-desktop]
image=ubuntu:24.04
additional_flags="--group-add keep-groups --volume /lib/modules:/lib/modules:ro"
additional_packages="curl gnupg alsa-utils alsa-tools lib32z1 libnss3"
init_hooks=/var/home/zefs/prog/distrobox/claude-desktop-init.sh
exported_apps=claude-desktop
start_now=true


# ---------------------------------------------------------------------------
# dev — VERIFIED against the box's own dnf history, 2026-09-20
# ---------------------------------------------------------------------------
# Reconstructed from inside the running box. `dnf history` shows two installs
# beyond the image build and distrobox's default tool set: the Bevy set, run
# by hand on 2026-09-17, and git, added 2026-09-20 because the box had none
# and Claude Code inside it couldn't see the repo. All names resolve. The box
# was made with a bare `distrobox create --name dev --image fedora:44` — no
# extra flags, so none are declared here.
#
# The earlier "known wrong package names" note was bwapi's problem (the i686
# and wine wrangling in shell history), not this box's.
#
# mesa-vulkan-drivers is already in distrobox's default Fedora package set.
# It stays listed because Bevy needs it and that default is not ours to rely on.
#
# rustup / rust-analyzer / node / python tooling are deliberately absent:
# they live in $HOME (~/.cargo, ~/.rustup), which is shared, so they survive
# a rebuild without being declared here. python3 is present in the box only
# as a weak dependency of distrobox's tool set, not because anything asked.

[dev]
image=fedora:44
additional_packages="git gcc-c++ libX11-devel alsa-lib-devel systemd-devel wayland-devel libxkbcommon-devel mesa-vulkan-drivers"
start_now=false
# init_hooks=/var/home/zefs/prog/distrobox/dev-init.sh
# Consider a per-container CARGO_TARGET_DIR here — target/ dirs built against
# different glibc will thrash between boxes. Untested, see bazzite-03-reference.


# ---------------------------------------------------------------------------
# bwapi — PLACEHOLDER, and the base image is an open question
# ---------------------------------------------------------------------------
# The runbook said fedora:44; the first-week doc argued for Arch because 32-bit
# multilib and Wine are much less painful there. Set this to whatever you
# actually built, then fix the package list from the other chat.

[bwapi]
image=fedora:44
additional_packages=""
start_now=false
